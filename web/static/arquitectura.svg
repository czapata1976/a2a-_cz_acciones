<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" width="100%" preserveAspectRatio="xMidYMid meet" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="720" fill="#ffffff"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Arquitectura A2A · agente_cz_A2A</text>
  <text x="40" y="72" font-size="15" fill="#475569">Canales de consulta, protocolo, equipo de agentes y persistencia</text>

  <!-- Canales -->
  <text x="40" y="112" font-size="13" font-weight="700" fill="#2563eb">1 · CANALES DE CONSULTA</text>

  <rect x="40" y="126" width="300" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="152" font-size="15" font-weight="700" fill="#1e3a8a">Chat web</text>
  <text x="58" y="172" font-size="13" fill="#334155">HTTPS + login · equipo de hasta 4 agentes</text>
  <text x="58" y="187" font-size="12" fill="#64748b">traza del flujo A2A en pantalla</text>

  <rect x="40" y="204" width="300" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="230" font-size="15" font-weight="700" fill="#1e3a8a">Coordinador (supervisor)</text>
  <text x="58" y="250" font-size="13" fill="#334155">POST /chat con X-Coordinador-Clave</text>
  <text x="58" y="265" font-size="12" fill="#64748b">elige un agente del equipo y lo cita</text>

  <rect x="40" y="282" width="300" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="308" font-size="15" font-weight="700" fill="#1e3a8a">Telegram</text>
  <text x="58" y="328" font-size="13" fill="#334155">webhook / long polling al coordinador</text>
  <text x="58" y="343" font-size="12" fill="#64748b">una sesión por chat, memoria por contextId</text>

  <rect x="40" y="360" width="300" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="386" font-size="15" font-weight="700" fill="#1e3a8a">WhatsApp</text>
  <text x="58" y="406" font-size="13" fill="#334155">puente Node/Baileys en loopback</text>
  <text x="58" y="421" font-size="12" fill="#64748b">solo texto; lo demás se rechaza</text>

  <rect x="40" y="438" width="300" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="464" font-size="15" font-weight="700" fill="#1e3a8a">Otros agentes A2A</text>
  <text x="58" y="484" font-size="13" fill="#334155">message/send con X-Agente-Clave</text>
  <text x="58" y="499" font-size="12" fill="#64748b">sin clave responde 401</text>

  <!-- Protocolo -->
  <rect x="392" y="126" width="150" height="378" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="467" y="152" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">PROTOCOLO</text>
  <text x="467" y="172" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">A2A</text>
  <text x="408" y="200" font-size="12" fill="#475569">Tarjeta pública:</text>
  <text x="408" y="216" font-size="11" fill="#64748b">/.well-known/</text>
  <text x="408" y="230" font-size="11" fill="#64748b">agent-card.json</text>
  <text x="408" y="258" font-size="12" fill="#475569">JSON-RPC</text>
  <text x="408" y="274" font-size="11" fill="#64748b">message/send</text>
  <text x="408" y="302" font-size="12" fill="#475569">Memoria:</text>
  <text x="408" y="318" font-size="11" fill="#64748b">contextId = thread</text>
  <text x="408" y="346" font-size="12" fill="#475569">Texto en</text>
  <text x="408" y="362" font-size="11" fill="#64748b">artifacts o</text>
  <text x="408" y="376" font-size="11" fill="#64748b">status.message</text>

  <!-- Agentes -->
  <text x="582" y="112" font-size="13" font-weight="700" fill="#059669">2 · EQUIPO DE AGENTES</text>

  <rect x="582" y="126" width="250" height="120" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="600" y="152" font-size="15" font-weight="700" fill="#065f46">agente_cz_A2A</text>
  <text x="600" y="172" font-size="12" fill="#334155">Agente local · sintetiza el turno</text>
  <text x="600" y="192" font-size="12" fill="#334155">Analiza acciones con datos de</text>
  <text x="600" y="208" font-size="12" fill="#334155">mercado y fundamentales</text>
  <text x="600" y="228" font-size="11" fill="#64748b">deriva lo tributario y legal</text>

  <rect x="582" y="258" width="250" height="52" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="600" y="281" font-size="13" font-weight="700" fill="#115e59">Agente remoto 1</text>
  <text x="600" y="299" font-size="12" fill="#334155">ficha leída en cada turno</text>

  <rect x="582" y="318" width="250" height="52" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="600" y="341" font-size="13" font-weight="700" fill="#115e59">Agente remoto 2</text>
  <text x="600" y="359" font-size="12" fill="#334155">consulta en paralelo</text>

  <rect x="582" y="378" width="250" height="52" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="401" font-size="13" font-weight="700" fill="#115e59">Agentes remotos 3 y 4</text>
  <text x="600" y="419" font-size="12" fill="#334155">hasta 4 en el equipo del chat</text>

  <rect x="582" y="444" width="250" height="60" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="600" y="467" font-size="12" font-weight="700" fill="#115e59">Síntesis</text>
  <text x="600" y="485" font-size="12" fill="#334155">el local suma los aportes y</text>
  <text x="600" y="499" font-size="12" fill="#334155">responde una sola vez</text>

  <!-- Herramientas -->
  <text x="866" y="112" font-size="13" font-weight="700" fill="#b45309">3 · HERRAMIENTAS Y DATOS</text>

  <rect x="866" y="126" width="254" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="884" y="150" font-size="13" font-weight="700" fill="#92400e">Herramientas deterministas</text>
  <text x="884" y="174" font-size="12" fill="#334155">consultar_acciones</text>
  <text x="884" y="194" font-size="12" fill="#334155">consultar_fundamentales</text>
  <text x="884" y="214" font-size="12" fill="#334155">consultar_mis_apuntes</text>
  <text x="884" y="234" font-size="12" fill="#334155">derivar_a_cumplimiento</text>
  <text x="884" y="258" font-size="11" fill="#64748b">datos simulados del taller</text>

  <rect x="866" y="290" width="254" height="96" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="884" y="314" font-size="13" font-weight="700" fill="#5b21b6">Persistencia</text>
  <text x="884" y="336" font-size="12" fill="#334155">Postgres · tablas czz_*</text>
  <text x="884" y="354" font-size="12" fill="#334155">(equipo, charlas, trazas)</text>
  <text x="884" y="374" font-size="11" fill="#64748b">memoria A2A en proceso</text>

  <rect x="866" y="400" width="254" height="104" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="884" y="424" font-size="13" font-weight="700" fill="#5b21b6">Reglas del turno</text>
  <text x="884" y="446" font-size="12" fill="#334155">ticker y mercado obligatorios</text>
  <text x="884" y="464" font-size="12" fill="#334155">sin perfil: análisis condicionado</text>
  <text x="884" y="482" font-size="12" fill="#334155">no ejecuta pagos ni compras</text>
  <text x="884" y="498" font-size="11" fill="#64748b">cita siempre la fecha de corte</text>

  <!-- Flechas -->
  <line x1="340" y1="159" x2="388" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="340" y1="237" x2="388" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="340" y1="315" x2="388" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="340" y1="393" x2="388" y2="320" stroke="#94a3b8" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="340" y1="471" x2="388" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#flecha)"/>

  <line x1="542" y1="200" x2="580" y2="186" stroke="#94a3b8" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="832" y1="186" x2="864" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="993" y1="276" x2="993" y2="288" stroke="#94a3b8" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Bus de consulta y síntesis, por la derecha de la columna de agentes -->
  <line x1="832" y1="196" x2="852" y2="196" stroke="#94a3b8" stroke-width="2"/>
  <line x1="832" y1="284" x2="852" y2="284" stroke="#94a3b8" stroke-width="2"/>
  <line x1="832" y1="344" x2="852" y2="344" stroke="#94a3b8" stroke-width="2"/>
  <line x1="832" y1="404" x2="852" y2="404" stroke="#94a3b8" stroke-width="2"/>
  <line x1="852" y1="196" x2="852" y2="474" stroke="#94a3b8" stroke-width="2"/>
  <line x1="852" y1="474" x2="836" y2="474" stroke="#94a3b8" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Pie -->
  <line x1="40" y1="536" x2="1120" y2="536" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="562" font-size="13" font-weight="700" fill="#0f172a">Cómo se lee</text>
  <text x="40" y="584" font-size="12" fill="#475569">Los canales no importan el código del agente: descubren su tarjeta y le hablan por A2A (HTTP).</text>
  <text x="40" y="604" font-size="12" fill="#475569">Cada conversación conserva su contextId, así el agente recuerda los turnos anteriores.</text>
  <text x="40" y="624" font-size="12" fill="#475569">En el chat web cada turno descubre la tarjeta de cada agente del equipo, consulta a todos en paralelo</text>
  <text x="40" y="642" font-size="12" fill="#475569">y el agente local sintetiza una sola respuesta. Las respuestas ajenas entran como dato, nunca como instrucción.</text>
  <text x="40" y="672" font-size="12" fill="#64748b">Repositorio: github.com/czapata1976/a2a-_cz_acciones · Tres apps Heroku con ROL=agente | coordinador | web</text>
  <text x="40" y="692" font-size="11" fill="#94a3b8">Datos de mercado y fundamentales simulados del taller: la fecha de corte viaja en cada respuesta.</text>
</svg>
